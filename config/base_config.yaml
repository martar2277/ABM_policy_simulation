# Base configuration for ABM Policy Simulation
# Default parameters for all scenarios

simulation:
  duration_months: 12
  num_runs: 1  # Set to 30-100 for full policy analysis

agents:
  neets:
    count: 10
    initialization: "llm"  # "llm" or "random"

  businesses:
    count: 5
    initialization: "llm"  # "llm" or "random"

llm:
  enabled: true
  provider: "mock"  # "mock", "openai", or "anthropic"
  model: "gpt-4"
  # api_key: "your-api-key-here"  # Or use environment variable

policies:
  counseling:
    budget_monthly: 50000  # Euros per month
    intensity: 0.12  # Effect strength (0-1)
    cost_per_neet: 500  # Cost to serve one NEET per month

  subsidy:
    available: true
    effectiveness: 0.5  # Multiplier effect (0.3-1.0)

matching:
  skill_threshold: 0.4  # Minimum skill match (0-1)
  transportation_floor: 0.6  # Minimum accessibility (0-1)
  min_business_willingness: 0.5  # Minimum willingness (0-1)
  max_attempts_per_neet: 3  # Max job applications per month

environment:
  region_size: 50  # Geographic grid size (km)
  max_viable_distance: 50  # Max commute distance (km)

output:
  save_monthly_metrics: true
  save_final_report: true
  save_agent_histories: false
  output_dir: "data/output"
